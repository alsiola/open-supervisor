# Cuts a release by hand: Actions → release → Run workflow. semantic-release reads the Conventional Commits
# since the last tag to pick the next version, writes CHANGELOG.md, commits and tags it on main, then hands
# the tag to goreleaser, which builds every platform, publishes the GitHub release with the same notes and
# updates the Homebrew tap. With no feat/fix/breaking commit since the last tag, it releases nothing.
name: release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the next version and its notes
        type: boolean
        default: false
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true
      - run: >-
          npm install --no-save --no-package-lock --no-audit --no-fund
          semantic-release@25
          @semantic-release/changelog@7
          @semantic-release/git@11
          @semantic-release/exec@7
          conventional-changelog-conventionalcommits@9
      - run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
