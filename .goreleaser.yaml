# Release builds: `git tag v0.1.0 && git push --tags` runs .github/workflows/release.yml, which runs this.
version: 2
project_name: open-supervisor

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/open-supervisor
    binary: open-supervisor
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, docs/*]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# `brew install alsiola/tap/open-supervisor`. Needs a repo alsiola/homebrew-tap and a HOMEBREW_TAP_TOKEN
# secret that can push to it; without the secret this step is skipped and the release goes ahead.
homebrew_casks:
  - name: open-supervisor
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    license: MIT
    repository:
      owner: alsiola
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/alsiola/open-supervisor
    description: Claims issues across your repos and works each in its own coding-agent session
    # The binary isn't notarized, so the quarantine flag comes off after install. Written as postflight_steps
    # rather than through hooks, which GoReleaser renders as the `postflight` block Homebrew 7 deprecates.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:           ["-dr", "com.apple.quarantine", "open-supervisor"],
              chdir:          ".",
              writable_paths: ["open-supervisor"]
        end
      end

nfpms:
  - package_name: open-supervisor
    homepage: https://github.com/alsiola/open-supervisor
    description: Claims issues across your repos and works each in its own coding-agent session
    maintainer: alsiola
    formats: [deb, rpm, apk]
    license: MIT
    recommends: [git]
